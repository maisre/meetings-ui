<div class="members-container">
  <div class="header">
    <h1>Members</h1>
    <div class="header-actions">
      <button class="create-btn" (click)="toggleCreateForm()" [disabled]="loading">
        {{ showCreateForm ? 'Cancel' : 'Create New' }}
      </button>
      <button class="refresh-btn" (click)="refreshMembers()" [disabled]="loading">
        {{ loading ? 'Loading...' : 'Refresh' }}
      </button>
    </div>
  </div>

  <div class="create-form" *ngIf="showCreateForm">
    <input
      type="text"
      class="create-input"
      placeholder="Enter member name..."
      [(ngModel)]="newMemberName"
      (keyup.enter)="createMember()"
    />
    <button
      class="save-btn"
      (click)="createMember()"
      [disabled]="!newMemberName.trim() || creating"
    >
      {{ creating ? 'Saving...' : 'Save' }}
    </button>
  </div>

  <div class="search-container" *ngIf="!loading && !error">
    <input
      type="text"
      class="search-input"
      placeholder="Search members..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading members...</p>
  </div>

  <div class="error" *ngIf="error">
    <p>{{ error }}</p>
    <button class="retry-btn" (click)="refreshMembers()">Retry</button>
  </div>

  <div class="members-grid" *ngIf="!loading && !error">
    <ch-member-card
      *ngFor="let member of filteredMembers"
      [member]="member"
      (memberRemoved)="onMemberRemoved($event)"
    >
    </ch-member-card>
  </div>

  <div class="empty-state" *ngIf="!loading && !error && filteredMembers.length === 0">
    <p>{{ searchTerm ? 'No members match your search.' : 'No members found.' }}</p>
  </div>
</div>
